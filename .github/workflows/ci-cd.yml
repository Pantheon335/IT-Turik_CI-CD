name: CI/CD

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if images for this commit already exist
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/**"]

env:
  UPSTREAM_REPO: Mox1toGH/IT-Turik1
  UPSTREAM_BRANCH: dev

concurrency:
  group: ci-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      prefix: ${{ steps.check.outputs.prefix }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is there a new upstream commit?
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "::error::Branch $UPSTREAM_BRANCH not found in $UPSTREAM_REPO"; exit 1; }
          short=${sha:0:7}
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] \
             && docker manifest inspect "$prefix-backend:sha-$short" >/dev/null 2>&1 \
             && docker manifest inspect "$prefix-frontend:sha-$short" >/dev/null 2>&1; then
            echo "Images for $short already exist, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commit $short on $UPSTREAM_REPO@$UPSTREAM_BRANCH, building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  backend-check:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: itturik
          POSTGRES_USER: itturik
          POSTGRES_PASSWORD: itturik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itturik -d itturik"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: itturik
      DB_USER: itturik
      DB_PASSWORD: itturik
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      PROFILING_ENABLED: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries (same as Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libcairo2 \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --noinput

  frontend-check:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check + production build
        run: npm run build
      - name: Unit tests
        run: npm run test

  images:
    needs: [detect, backend-check, frontend-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name, tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.detect.outputs.prefix }}-${{ matrix.component }}
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ needs.detect.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ needs.detect.outputs.sha }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
